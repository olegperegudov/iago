name: Build Iago

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Every push to main is a release: bump the patch version, commit, tag.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      skipped: ${{ steps.bump.outputs.skipped }}
      notes: ${{ steps.bump.outputs.notes }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - name: Auto-bump version
        id: bump
        run: |
          CURRENT=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "Current version: $CURRENT"

          # The bump commit is itself a push to main. Without these two guards it
          # would trigger this workflow again, forever.
          if git describe --exact-match HEAD 2>/dev/null; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Commit already tagged, skipping"
            exit 0
          fi
          LAST_MSG=$(git log -1 --pretty=%s)
          if [[ "$LAST_MSG" == v* ]] || [[ "$LAST_MSG" == *"auto-bump"* ]]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Last commit was a version bump, skipping"
            exit 0
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=$((PATCH + 1))
          NEW="$MAJOR.$MINOR.$PATCH"
          TAG="v$NEW"
          echo "Bumping to: $NEW"

          python3 -c "
          import json
          f = 'src-tauri/tauri.conf.json'
          d = json.load(open(f))
          d['version'] = '$NEW'
          json.dump(d, open(f, 'w'), indent=2)
          "
          sed -i "s/^version = \"$CURRENT\"/version = \"$NEW\"/" src-tauri/Cargo.toml

          # Close the changelog's Unreleased section under this version and carry
          # its bullets into the release the tray's version item opens. Runs
          # before `git add -A` so the rewritten file goes in the bump commit.
          python3 .github/scripts/cut_release_notes.py "$NEW" > /tmp/release-notes.md
          {
            echo "notes<<IAGO_NOTES_EOF"
            cat /tmp/release-notes.md
            echo "IAGO_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$TAG auto-bump"
          git tag "$TAG"
          git push origin main "$TAG"

          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    if: needs.version.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install
      - name: JS unit tests (search, filtering, highlighting)
        run: npm test

      - name: Release-notes cutter tests
        working-directory: .github/scripts
        run: python3 test_cut_release_notes.py

  build-windows:
    needs: [version, test]
    if: needs.version.outputs.skipped != 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri
      - run: npm install

      - name: Rust unit tests
        working-directory: src-tauri
        shell: bash
        # Absolute path: the runner has a `cargo` shim earlier in PATH.
        run: "$HOME/.cargo/bin/cargo test --lib"

      - name: Build Tauri app
        id: build
        continue-on-error: true
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --target x86_64-pc-windows-msvc --bundles nsis
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Iago ${{ needs.version.outputs.tag }}
          releaseBody: ${{ needs.version.outputs.notes || 'See the assets below to download and install.' }}
          releaseDraft: false
          prerelease: true

      # The build is reliable; the upload occasionally dies on a transient GitHub
      # API timeout. There is no native retry for a `uses:` step, so repeat it
      # once — the rebuild comes off the warm Rust cache.
      - name: Build Tauri app (retry)
        if: steps.build.outcome == 'failure'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --target x86_64-pc-windows-msvc --bundles nsis
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Iago ${{ needs.version.outputs.tag }}
          releaseBody: ${{ needs.version.outputs.notes || 'See the assets below to download and install.' }}
          releaseDraft: false
          prerelease: true

      # Re-upload the installer under a stable, version-less name so the README
      # download button can link straight at the file
      # (releases/latest/download/<name>). Tauri's own asset names carry the
      # version, so any direct link to them dies on the next bump — which is why
      # the buttons used to dump the user on the releases page instead.
      - name: Publish stable-named Windows installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          exe=$(ls src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | head -1)
          cp "$exe" Iago_Windows_Setup.exe
          gh release upload "$TAG" Iago_Windows_Setup.exe --clobber --repo "$GITHUB_REPOSITORY"


      # Stage check on the real OS: install what we are about to ship, launch it,
      # and demand it still be alive 10s later with the right version. A tray app
      # has no window to assert on — a living process IS the smoke signal.
      - name: Smoke-test installed app
        shell: pwsh
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          Start-Process -FilePath ".\Iago_Windows_Setup.exe" -ArgumentList "/S" -Wait

          # Tauri NSIS (installMode currentUser) installs under %LOCALAPPDATA%\<ProductName>.
          $installDir = Join-Path $env:LOCALAPPDATA "Iago"
          $exe = Get-ChildItem (Join-Path $installDir "*.exe") -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch "unins" } | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::installed binary not found under $installDir"; exit 1 }

          $ver = $exe.VersionInfo.ProductVersion
          if ("v$ver" -ne $env:TAG) {
            Write-Host "::error::installed version '$ver' != tag '$env:TAG'"
            exit 1
          }

          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 10
          $appLog = Join-Path $env:APPDATA "iago\debug.log"
          if (-not (Get-Process -Id $proc.Id -ErrorAction SilentlyContinue)) {
            $code = try { $proc.ExitCode } catch { "unknown" }
            Write-Host "::error::Iago exited within 10s of launch on a clean machine (exit code $code)"
            if (Test-Path $appLog) { Write-Host "--- debug.log tail ---"; Get-Content $appLog -Tail 50 }
            exit 1
          }
          Write-Host "Iago alive after 10s (PID $($proc.Id))"

          Stop-Process -Id $proc.Id -Force
          # Leave the runner clean; best-effort, runners are ephemeral.
          $unins = Get-ChildItem (Join-Path $installDir "unins*.exe") -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($unins) { Start-Process -FilePath $unins.FullName -ArgumentList "/S" -Wait }

  build-macos:
    # Runs AFTER build-windows, not beside it: tauri-action publishes latest.json
    # by read-modify-writing the same release asset, and two jobs uploading at
    # once race on a stale read and silently drop platform keys — which is how
    # Ribbit once stranded every Apple-Silicon user on "update failed".
    needs: [version, test, build-windows]
    if: needs.version.outputs.skipped != 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri
      - run: npm install

      - name: Rust unit tests
        working-directory: src-tauri
        shell: bash
        run: "$HOME/.cargo/bin/cargo test --lib"

      # Iago pastes by posting a synthetic Cmd+V, which macOS only allows
      # with an Accessibility grant. That grant is anchored to the code signature:
      # an ad-hoc build gets a new identity on every release, so the user would
      # have to re-approve the app after each update. Signing with a *stable*
      # cert anchors the grant to the cert, and it survives.
      #
      # A self-signed cert only counts as a valid codesigning identity once its
      # root is trusted — until then `security find-identity -v -p codesigning`
      # omits it and the bundler dies with "failed to resolve signing identity".
      - name: Set up code-signing keychain (self-signed, trusted)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/iago-signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          P12="$RUNNER_TEMP/iago.p12"
          CERT="$RUNNER_TEMP/iago-cert.pem"

          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$P12"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Let codesign reach the private key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null

          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          security find-certificate -c "$APPLE_SIGNING_IDENTITY" -p "$KEYCHAIN" > "$CERT"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$CERT"

          echo "Valid codesigning identities after trust:"
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning | grep -q "$APPLE_SIGNING_IDENTITY" \
            || { echo "::error::signing identity '$APPLE_SIGNING_IDENTITY' did not resolve"; exit 1; }

      # Native per-arch builds, run in order inside this one job. A universal
      # (lipo'd) bundle does not anchor TCC grants reliably — Ribbit lost its
      # microphone that way — and the sequential order keeps two uploads from
      # touching latest.json at the same moment.
      - name: Build Tauri app (Apple Silicon)
        id: build_arm
        continue-on-error: true
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          args: --target aarch64-apple-darwin --bundles app,dmg
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Iago ${{ needs.version.outputs.tag }}
          releaseBody: ${{ needs.version.outputs.notes || 'See the assets below to download and install.' }}
          releaseDraft: false
          prerelease: true

      - name: Build Tauri app (Apple Silicon, retry)
        if: steps.build_arm.outcome == 'failure'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          args: --target aarch64-apple-darwin --bundles app,dmg
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Iago ${{ needs.version.outputs.tag }}
          releaseBody: ${{ needs.version.outputs.notes || 'See the assets below to download and install.' }}
          releaseDraft: false
          prerelease: true

      - name: Build Tauri app (Intel)
        id: build_intel
        continue-on-error: true
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          args: --target x86_64-apple-darwin --bundles app,dmg
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Iago ${{ needs.version.outputs.tag }}
          releaseBody: ${{ needs.version.outputs.notes || 'See the assets below to download and install.' }}
          releaseDraft: false
          prerelease: true

      - name: Build Tauri app (Intel, retry)
        if: steps.build_intel.outcome == 'failure'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          args: --target x86_64-apple-darwin --bundles app,dmg
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Iago ${{ needs.version.outputs.tag }}
          releaseBody: ${{ needs.version.outputs.notes || 'See the assets below to download and install.' }}
          releaseDraft: false
          prerelease: true

      # Stable, version-less copies for the README download buttons (both Macs).
      # Direct links: releases/latest/download/Iago_macOS_*.dmg.
      - name: Publish stable-named macOS installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          arm=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          intel=$(ls src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$arm" Iago_macOS_AppleSilicon.dmg
          cp "$intel" Iago_macOS_Intel.dmg
          gh release upload "$TAG" Iago_macOS_AppleSilicon.dmg Iago_macOS_Intel.dmg --clobber --repo "$GITHUB_REPOSITORY"

      # Release smoke: the bundle the user is about to install must be signed,
      # must claim the version we tagged, and must actually START on a clean
      # machine. A mismatched Info.plist would have the updater offer the same
      # version forever; a crash-at-launch build must never reach anyone.
      - name: Smoke-test macOS bundles
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          for arch in aarch64-apple-darwin x86_64-apple-darwin; do
            app=$(ls -d src-tauri/target/$arch/release/bundle/macos/*.app | head -1)
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            plist_ver=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist")
            if [ "v$plist_ver" != "$TAG" ]; then
              echo "::error::$app version $plist_ver != tag $TAG"
              exit 1
            fi

            # The runner is Apple Silicon: the Intel build can only launch via
            # Rosetta, and a runner without it is NOT evidence the build is
            # broken — skip the launch, keep codesign and version.
            native=$(uname -m)
            if [ "$arch" = "x86_64-apple-darwin" ] && [ "$native" = "arm64" ] \
               && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
              echo "::notice::Rosetta unavailable — skipping launch smoke for the Intel build (codesign + version OK)"
              continue
            fi
            bin=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")
            "$app/Contents/MacOS/$bin" & pid=$!
            sleep 10
            if kill -0 "$pid" 2>/dev/null; then
              echo "Iago ($arch) alive after 10s (PID $pid)"
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            else
              code=0; wait "$pid" || code=$?
              echo "::error::Iago ($arch) exited within 10s of launch on a clean machine (exit code $code)"
              log="$HOME/Library/Application Support/iago/debug.log"
              [ -f "$log" ] && { echo "--- debug.log tail ---"; tail -50 "$log"; }
              exit 1
            fi
          done

      # The in-app updater is only as good as latest.json. Fail loudly here rather
      # than ship a manifest that silently strands one platform on an old version.
      - name: Verify updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p latest.json --clobber
          python3 .github/scripts/verify_manifest.py latest.json "$TAG"

  # The stable channel moves only after every gate above is green: unit tests,
  # both platform builds, the install-and-launch stage checks inside them, and
  # the manifest verification. That is what the prerelease window is for — a
  # release nobody promotes is a release nobody receives. If a promoted build
  # turns out bad, demote it by hand: Actions → Release control → rollback.
  promote:
    needs: [version, test, build-windows, build-macos]
    if: needs.version.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote to stable
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --prerelease=false --latest=true
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '"stable channel now serves \(.tag_name)"'
